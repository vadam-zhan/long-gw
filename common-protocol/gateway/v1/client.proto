syntax = "proto3";

package gateway.v1;

option go_package = "github.com/vadam-zhan/long-gw/common-protocol/gen/gateway/v1;gatewayv1";

import "gateway/v1/common.proto";
import "validate/validate.proto";

// ═════════════════════════════════════════════════════════════════════════════
// Gateway 治理层业务错误码（范围：18001-18099）
//
// 这些错误码用于 gateway 治理事件（RateLimited / AdminNotice）的业务场景，
// 与 gateway.v1.ErrorCode（网关层错误码 1xxx-5xxx）互补。
// ═════════════════════════════════════════════════════════════════════════════
enum ClientErrorCode {
    CLIENT_ERROR_CODE_UNSPECIFIED = 0;

    // ── 客户端合规（18001-18015）──
    CLIENT_VERSION_DEPRECATED   = 18001; // 客户端版本过旧，必须升级
    CLIENT_VERSION_UNSUPPORTED  = 18002; // 客户端版本不受支持
    CLIENT_PROTOCOL_MISMATCH    = 18003; // 协议版本不匹配
    CLIENT_SDK_INCOMPATIBLE     = 18004; // SDK 与网关不兼容

    // ── 地理与网络（18016-18030）──
    CLIENT_REGION_BLOCKED       = 18016; // 地区被屏蔽
    CLIENT_IP_BLOCKED           = 18017; // IP 被屏蔽
    CLIENT_NETWORK_UNTRUSTED    = 18018; // 不可信网络环境（VPN/代理检测）

    // ── 限流与降级（18031-18045）──
    CLIENT_RATE_LIMITED         = 18031; // 客户端请求频率受限
    CLIENT_CONN_LIMIT_EXCEEDED  = 18032; // 单用户连接数超限
    CLIENT_GLOBAL_RATE_LIMITED  = 18033; // 全局限流
    CLIENT_DEGRADED             = 18034; // 服务降级中（部分功能受限）

    // ── 运维与系统（18046-18099）──
    CLIENT_MAINTENANCE          = 18046; // 系统维护中
    CLIENT_ADMIN_KICK           = 18047; // 管理员强制踢人
    CLIENT_VIOLATION_DETECTED   = 18048; // 检测到违规行为
    CLIENT_RESOURCE_EXHAUSTED   = 18049; // 网关资源耗尽
}

// ═════════════════════════════════════════════════════════════════════════════
// Gateway 治理事件
//
// 这些事件由网关直接生成并投递给客户端，不经过业务系统。
// 传输方式：序列化为 bytes 后写入 DispatchContext.payload
// 路由标识：DispatchContext.event_type = "gateway.{action}"
//
// 事件类型映射：
//   "gateway.rate_limited"   → RateLimited
//   "gateway.broadcast"      → SystemBroadcast
//   "gateway.admin_notice"   → AdminNotice
// ═════════════════════════════════════════════════════════════════════════════

message RateLimited {
    ErrorCode code = 1;
    string    limit_type = 2;        // "conn" | "user" | "biz" | "global"
    int32     current_qps = 3;
    int32     limit_qps = 4;
    int32     retry_after_ms = 5;
    map<string, string> details = 6;
}

message SystemBroadcast {
    string broadcast_id = 1 [(validate.rules).string = {max_len: 128}];
    string title = 2;
    string content = 3;
    string priority = 4;               // "high" | "normal" | "low"
    int64  expire_at = 5;
    map<string, string> ext = 6;
}

message AdminNotice {
    ErrorCode code = 1;
    string    message = 2;
    int64     effective_at = 3;
    int64     expire_at = 4;
    map<string, string> actions = 5;   // 建议操作（如 {"action": "relogin"}）
}
