syntax = "proto3";

package gateway.v1;

option go_package = "github.com/vadam-zhan/long-gw/common-protocol/gen/gateway/v1;gatewayv1";

import "validate/validate.proto";

// ═════════════════════════════════════════════════════════════════════════════
// 核心原则：
//   1. 所有消息（控制面 + 业务面）用统一的 GatewayFrame 结构
//   2. 控制面用数字 OpCode（精简，永不扩展）

// ─────────────────────────────────────────────────────────────────────────────
// OpCode：操作码
// ─────────────────────────────────────────────────────────────────────────────
enum OpCode {
    OP_CODE_UNSPECIFIED = 0;
    // 1: Dispatch — 业务事件（上/下行都走这个 opcode）
    //   客户端发送时：op=DISPATCH, t="im.chat", d=IMChat bytes
    //   服务端发送时：op=DISPATCH, t="im.chat", d=IMChat bytes
    DISPATCH = 1;

    // 2: Hello — 连接问候（Gateway → Client，连接建立后立即发送）
    HELLO = 2;

    // 3: Handshake — 握手认证（Client → Gateway）
    HANDSHAKE = 3;

    // 4: Ready — 准备就绪（Gateway → Client）
    READY = 4;

    // 5: Heartbeat — 心跳请求（Client → Gateway）
    HEARTBEAT = 5;

    // 6: HeartbeatAck — 心跳确认（Gateway → Client）
    HEARTBEAT_ACK = 6;

    // 7: Resume — 断线恢复（Client → Gateway）
    RESUME = 7;

    // 8: Reconnect — 服务端要求重连（Gateway → Client）
    RECONNECT = 8;

    // 9: Ack — 消息确认（Client → Gateway，QoS-1）
    ACK = 9;

    // 10: Error — 错误响应 双向
    ERROR = 10;

    // 11: KICK — 服务端强制断开连接（Gateway → Client）
    KICK = 11;

    // 12: AuthReFresh — 认证刷新（Client → Gateway）
    AUTH_REFRESH = 12;

    // 13: AuthRefreshAck — 认证刷新确认（Gateway → Client）
    AUTH_REFRESH_ACK = 13;
}

// GatewayFrame 所有消息（控制面 + 业务面）都用这个结构。
message GatewayFrame {
    // op: 操作码，决定消息的语义类别
    OpCode op = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];

    // data: 消息数据，根据 op 字段选择具体的消息类型
    /* oneof data {
        Dispatch dispatch = 2;
        Hello hello = 3;
        Handshake handshake = 4;
        Ready ready = 5;
        Error error = 6;
        Resume resume = 7;
        Heartbeat heartbeat = 8;
        HeartbeatAck heartbeat_ack = 9;
        AuthRefresh auth_refresh = 10;
        Reconnect reconnect = 11;
        Kick kick = 12;
        Ack ack = 13;
        AuthRefreshAck auth_refresh_ack = 14;
    }
    */
    bytes data = 2;
}

message Dispatch {
    // payload: 事件数据（protobuf 编码后的字节）
    bytes payload = 1;

    // seq_id: 序列号
    //   规则：
    //     - 服务端发送的 DISPATCH 必须带递增 seq_id
    //     - 客户端发送的 ACK 带被确认消息的 seq_id
    uint64 seq_id = 2 [(validate.rules).uint64 = {gte: 0}];;

    // msg_id: 全局唯一消息 ID（用于 ACK 关联、幂等去重）
    string msg_id = 3 [(validate.rules).string = {min_len: 1, max_len: 128}];

    // biz_code: 业务代码 e.g. "im", "live", "call".
    string biz_code = 4 [(validate.rules).string = {min_len: 1, max_len: 128}];

    // event_type: 事件类型
    //   格式："{domain}.{action}"，例如："presence.update", "voice.signal"
    //     "im.chat", "im.receipt", "live.comment", "call.offer"
    //   设计原则：新增业务事件无需修改 OpCode，零改动网关
    //   event_type: 事件类型，用于区分不同的业务事件
    //   例如："im.chat", "im.login", "im.logout"
    string event_type = 5 [(validate.rules).string = {min_len: 1, max_len: 128}];

    // 绝对过期时间戳 Unix 毫秒，0=永不过期
    int64 expire_at = 6;

    // from / to: 寻址信息
    RouteTarget from = 10;
    RouteTarget to   = 11;

    // delivery: 投递控制（QoS、优先级、离线存储）
    Delivery delivery = 12;

    // trace: 分布式追踪上下文
    TraceContext trace = 13;

    // timestamp: 发送方时间戳（Unix 毫秒）
    int64 timestamp = 14 [(validate.rules).int64 = {gte: 0}];

    // origin: 消息来源（网关填充，客户端只读）
    MessageOrigin origin = 15 [(validate.rules).enum = {defined_only: true, not_in: [0]}];

    // recv_at: 网关收到时间（Unix 毫秒）
    int64 recv_at = 16 [(validate.rules).int64 = {gte: 0}];

    // metadata: 扩展 K-V 元数据
    //   网关保留键（x-gw- 前缀）：x-gw-recv-ts, x-gw-node, x-gw-retry
    //   业务键（x-biz- 前缀）：网关透传不处理
    map<string, string> metadata = 99 [(validate.rules).map = {max_pairs: 64}];
}

// ── QoS ──
enum QosClass {
    QOS_CLASS_UNSPECIFIED = 0;
    AT_MOST_ONCE  = 1;
    AT_LEAST_ONCE = 2;
}

// ── 编码 ──
enum Codec {
    CODEC_UNSPECIFIED = 0;
    JSON     = 1;
    PROTOBUF = 2;
    MSGPACK  = 3;
}

// ── 压缩 ──
enum CompressAlgo {
    COMPRESS_ALGO_UNSPECIFIED = 0;
    NONE   = 1;
    GZIP   = 2;
    ZSTD   = 3;
    SNAPPY = 4;
}

// ── 路由 ──
enum RouteTargetType {
    ROUTE_TARGET_TYPE_UNSPECIFIED = 0;
    USER      = 1;
    DEVICE    = 2;
    SESSION   = 3;
    ROOM      = 4;   // 直播间广播
    TOPIC     = 5;   // Pub/Sub
    GROUP     = 6;   // IM 群组
    NODE      = 7;   // 节点广播
    BROADCAST = 8;   // 全局广播
}

enum MessageOrigin {
    ORIGIN_UNSPECIFIED = 0;
    CLIENT            = 1;
    RETRY             = 2;
    REPLAY            = 3;
    ORIGIN_BROADCAST  = 4;
    PUSHAPI           = 5;
    SYSTEM            = 6;
}

enum HeartbeatBufferLevel {
    BUFFER_LEVEL_UNSPECIFIED = 0;
    NORMAL        = 1;
    WARNING       = 2;
    FULL          = 3;
}

message RouteTarget {
    RouteTargetType type = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    // 目标用户ID、设备ID、会话ID、房间ID、主题或群组ID
    string target = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    map<string, string> labels = 3 [(validate.rules).map = {max_pairs: 32}];
}

// ── 追踪 ──
message TraceContext {
    string trace_id = 1 [(validate.rules).string = {max_len: 128}];
    string span_id  = 2 [(validate.rules).string = {max_len: 64}];
    string parent_span_id = 3 [(validate.rules).string = {max_len: 64}];
    bool sampled = 4;
    map<string, string> baggage = 5 [(validate.rules).map = {max_pairs: 64}];
}

// ── 投递控制 ──
message Delivery {
    QosClass qos = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    bool offline = 2;
    int32 priority = 3 [(validate.rules).int32 = {gte: 0, lte: 9}];
}

// ─────────────────────────────────────────────────────────────────────────────
// 控制面 Payload
//
// 每种 OpCode 对应 GatewayFrame.data 中编码的结构。
// 命名遵循 Discord Gateway 风格：用事件名而非 Request/Response。
//
// 连接生命周期：
//   1. TCP/WebSocket 连接建立
//   2. S→C  op=HELLO（含心跳间隔）
//   3. C→S  op=HANDSHAKE（含 Token）
//   4. S→C  op=READY（含 session_id）或 op=ERROR（认证失败）
//   5. 正常通信（op=DISPATCH 双向）
//   6. 定时 C→S op=HEARTBEAT  ←→  S→C op=HEARTBEAT_ACK
// ─────────────────────────────────────────────────────────────────────────────

// ── op=2 HELLO（S→C）───────────────────────────────────────────────────────
//   连接建立后服务端立即发送，告知客户端协议参数
message Hello {
    // 支持的编解码器 - session 进行固定
    repeated Codec supported_codecs = 1 [(validate.rules).repeated = {min_items: 1}];
    // 支持的压缩算法 - session 进行固定
    repeated CompressAlgo supported_compress = 2 [(validate.rules).repeated = {min_items: 1}];
    // 建议心跳间隔（秒）
    int32 heartbeat_interval = 3 [(validate.rules).int32 = {gte: 1, lte: 3600}];
    // 允许的最大 payload 字节数
    int64 max_body_size = 4 [(validate.rules).int64 = {gte: 1}];
    // 协议版本（如 "1"）
    string protocol_version = 5 [(validate.rules).string = {min_len: 1, max_len: 32}];
    // 处理节点 ID
    string node_id = 6 [(validate.rules).string = {min_len: 1, max_len: 128}];
    // 服务端 Unix 毫秒
    int64 server_time = 7 [(validate.rules).int64 = {gte: 0}];
}

// ── op=3 HANDSHAKE（C→S）──────────────────────────────────────────────────
//   客户端收到 HELLO 后发送，完成认证握手
message Handshake {
    string token = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
    string device_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string device_type = 3 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string sdk_version = 4 [(validate.rules).string = {min_len: 1, max_len: 128}];
    repeated string supported_extensions = 5 [(validate.rules).repeated = {max_items: 64}];
}

// ── op=4 READY（S→C）───────────────────────────────────────────────────────
//   认证成功，连接进入活跃状态
//   认证失败时发送 op=ERROR（GatewayError，code=ERR_HANDSHAKE_FAILED 等）
message Ready {
    string session_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string user_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    int64 server_time = 3 [(validate.rules).int64 = {gte: 0}];
    // 服务端最终确认的心跳间隔
    int32 heartbeat_interval = 4 [(validate.rules).int32 = {gte: 1, lte: 3600}];
    // 从此 Seq 开始补发离线消息
    uint64 replay_from = 5 [(validate.rules).uint64 = {gte: 0}];
    // 服务端最终确认的编解码器
    Codec selected_codec = 6 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    // 服务端最终确认的压缩算法
    CompressAlgo selected_compress = 7 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    // 网关实际启用的扩展列表
    repeated string extensions = 8 [(validate.rules).repeated = {max_items: 64}];
}

// ── op=10 ERROR（S→C，可双向）─────────────────────────────────────────────
//   通用错误通知
//   认证失败、恢复失败等场景也通过此消息返回错误
message Error {
    ErrorCode code = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    string message = 2 [(validate.rules).string = {min_len: 1, max_len: 1024}];
    string ref_msg_id = 3 [(validate.rules).string = {max_len: 128}];
    // 额外上下文（如限流配额、重试建议）
    map<string, string> details = 4 [(validate.rules).map = {max_pairs: 64}];
}

// ── op=7 RESUME（C→S）─────────────────────────────────────────────────────
//   断线重连时发送，替代 HANDSHAKE
message Resume {
    string session_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    // 客户端已收到的最高序列号
    uint64 last_seq = 2 [(validate.rules).uint64 = {gte: 0}];
    // 重连时刷新 Token
    string token = 3 [(validate.rules).string = {min_len: 1, max_len: 4096}];
}

// ── op=5 HEARTBEAT（C→S）──────────────────────────────────────────────────
message Heartbeat {
    // 客户端发送时间戳（毫秒）
    int64 client_time = 1 [(validate.rules).int64 = {gte: 0}];
    // 1=正常, 2=警告, 3=满载（服务端应降速）
    HeartbeatBufferLevel buffer_level = 2 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

// ── op=6 HEARTBEAT_ACK（S→C）───────────────────────────────────────────────
message HeartbeatAck {
    // 服务端收到心跳的时间
    int64 server_time = 1 [(validate.rules).int64 = {gte: 0}];
    // 动态调整的心跳间隔（秒）
    int32 heartbeat_interval = 2 [(validate.rules).int32 = {gte: 1, lte: 3600}];
}

// ── op=12 AUTH_REFRESH（C→S）───────────────────────────────────────────────
//   Token 续期请求
message AuthRefresh {
    string token = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
    string device_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
}

// ── op = 13 AUTH_REFRESH_ACK（S→C）───────────────────────────────────────────────
// AuthRefreshAck — 认证刷新确认（Gateway → Client）
message AuthRefreshAck {
    bool   success    = 1;
    // 新 Token 的过期时间（Unix 毫秒）
    int64  expire_at  = 2;
}

// ── op=8 RECONNECT（S→C）──────────────────────────────────────────────────
//   服务端要求客户端断开并重连（版本升级、负载均衡等场景）
message Reconnect {
    // 建议等待后重连（毫秒）
    int32 after_ms = 1 [(validate.rules).int32 = {gte: 0, lte: 600000}];
    // 新的连接地址（负载均衡）
    string resume_url = 2 [(validate.rules).string = {max_len: 2048}];
    // true = 可以 RESUME，false = 必须 HANDSHAKE
    bool can_resume = 3;
}

// ── op=11 KICK（S→C）───────────────────────────────────────────────────────
//   服务端强制断连（被踢下线、封号等）
message Kick {
    ErrorCode code = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    string reason = 2 [(validate.rules).string = {min_len: 1, max_len: 1024}];
    // 建议等待 N 秒后重连
    int32 reconnect_after = 3 [(validate.rules).int32 = {gte: 0, lte: 600000}];
    // true = 禁止自动重连（封号）
    bool permanent = 4;
}

// ── op=9 ACK（C→S）─────────────────────────────────────────────────────────
//   QoS-1 消息确认，支持单条和批量
message Ack {
    repeated string msg_ids = 1 [(validate.rules).repeated = {min_items: 1, max_items: 100}];
    // 客户端收到时间（Unix 毫秒）
    int64 recv_time = 3 [(validate.rules).int64 = {gte: 0}];
}

/*
连接生命周期对照
Client                              Server
  │                                    │
  │◄──────── op=2 HELLO ──────────────│  (服务端主动)
  │                                     │
  │─── op=3 HANDSHAKE ───────────────►│
  │◄──────── op=4 READY ──────────────│  (或 op=10 ERROR)
  │                                     │
  │   ... DISPATCH 双向通信 ...         │
  │                                     │
  │─── op=5 HEARTBEAT ───────────────►│
  │◄──────── op=6 HEARTBEAT_ACK ──────│
  │                                     │
  │─── op=12 AUTH_REFRESH ────────────►│  (Token 续期)
  │◄────────  op=4 READY  ─────────────│  (或发专门响应)

*/

// ═════════════════════════════════════════════════════════════════════════════
// 通用基础类型
// ═════════════════════════════════════════════════════════════════════════════

// ── 错误码 ──
enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;

    ERR_HEARTBEAT_TIMEOUT    = 1001;
    ERR_HANDSHAKE_FAILED     = 1002;
    ERR_AUTH_EXPIRED         = 1003;
    ERR_REPLACED_BY_NEW_LOGIN = 1004;
    ERR_SESSION_SUSPENDED    = 1005;
    ERR_SESSION_CLOSED       = 1006;
    ERR_PROTOCOL_VERSION     = 1007;
    ERR_CONN_RATE_LIMITED    = 1008;
    ERR_RESUME_FAILED        = 1009;  // op=RESUME 恢复失败（session_id 无效或过期）

    ERR_TOKEN_INVALID        = 2001;
    ERR_TOKEN_EXPIRED        = 2002;
    ERR_PERMISSION_DENIED    = 2003;
    ERR_DEVICE_BLOCKED       = 2004;
    ERR_IP_BLOCKED           = 2005;
    ERR_APP_ID_INVALID       = 2006;  // app_id 无效或不存在

    ERR_MESSAGE_TOO_LARGE    = 3001;
    ERR_INVALID_OPCODE      = 3002;
    ERR_MESSAGE_MALFORMED    = 3003;
    ERR_MESSAGE_EXPIRED      = 3004;
    ERR_RATE_LIMITED         = 3005;
    ERR_BAD_REQUEST          = 3006;
    ERR_OPCODE_UNEXPECTED    = 3007;  // 当前状态不允许该 OpCode（如未 HANDSHAKE 就发 DISPATCH）

    ERR_UPSTREAM_SEND_FAILED = 4001;
    ERR_OFFLINE_STORE_FAILED = 4002;
    ERR_MAX_RETRY_EXCEEDED   = 4003;
    ERR_ROUTE_NOT_FOUND      = 4004;
    ERR_TARGET_UNAVAILABLE   = 4005;
    ERR_DELIVERY_TIMEOUT     = 4006;

    // ── 订阅层（5xxx）──
    ERR_ROOM_NOT_FOUND       = 5001;
    ERR_TOPIC_NOT_FOUND      = 5002;
    ERR_ALREADY_SUBSCRIBED   = 5003;
    ERR_NOT_SUBSCRIBED       = 5004;
    ERR_ROOM_FULL            = 5005;
}
